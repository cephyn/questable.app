name: quest_cards
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  auto_size_text: 3.0.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  collection: 1.19.1
  custom_adaptive_scaffold: ^5.3.0
  crypto: 3.0.7
  file_picker: ^13.1.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  firebase_storage: ^13.6.0
  firebase_ui_auth: ^3.1.1
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  fluttertoast: ^10.0.2
  google_fonts: ^9.0.0
  google_sign_in: 7.2.0
  infinite_scroll_pagination: 5.1.1
  mime: ^2.1.0
  provider: 6.1.5+1
  url_launcher: ^6.3.3
  rxdart: 0.28.0
  shared_preferences: ^2.5.6
  http: 1.6.0
  gpt_markdown: ^1.3.4
  flutter_typeahead: 6.0.0
  intl: ^0.20.3
  go_router: ^18.0.2
  share_plus: ^13.3.1
  simple_icons: ^16.23.0 # Add simple_icons
  firebase_ai: ^4.0.0
  logging: ^1.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/icons/
    # Branding samples used for a visual refresh
    - samples/questable_logo.png
    - samples/questable_ico.png
    - samples/questable_ico_256.png
    - samples/questable_concept.png
